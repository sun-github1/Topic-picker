<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FutureMindz Fest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#481855;--accent-soft:#f3e8f7;--bg:linear-gradient(135deg,#6c5ce7 0%,#481855 50%,#2d0a3a 100%);--ink:#24112c;--muted:#6f5a78;--line:#e3d4ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:'Inter', system-ui,sans-serif;color:var(--ink);background:var(--bg);background-attachment:fixed;overflow-x:hidden}
h1,h2,h3,button,.fd{font-family:'Inter',system-ui,sans-serif}
button{cursor:pointer;border:0;font-size:1rem}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #fdcb6e;outline-offset:2px}
.lg{display:block;height:auto}
/* setup */
.setup{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{background:#fff;border-radius:22px;box-shadow:0 20px 60px #0006;width:100%;max-width:780px;padding:28px 32px}
.card .lg{width:min(340px,70%);margin:0 auto 6px}
.card h1{margin:0;text-align:center;color:var(--accent);font-size:2.2rem}
.sub{text-align:center;color:var(--muted);margin:2px 0 22px}
label.f{display:flex;align-items:center;gap:12px;font-weight:800;margin-bottom:18px}
input[type=number],input[type=text],textarea{box-sizing:border-box;font:inherit;border:2px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);width:100%}
input[type=number]{width:90px;text-align:center;font-weight:800}
input:focus,textarea:focus{border-color:var(--accent)}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:start;background:var(--accent-soft);border-radius:14px;padding:12px;margin-bottom:10px}
.trow .no{font-family:'Inter', sans-serif;font-weight:600;color:#fff;background:var(--accent);border-radius:999px;padding:6px 12px;white-space:nowrap}
.trow textarea{grid-column:2/3;resize:vertical;min-height:58px}
.trow .x{grid-row:1;grid-column:3;background:#fff;color:#c0392b;border-radius:999px;width:36px;height:36px;font-size:1.4rem;line-height:1;font-weight:700}
.trow .x:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.btn{background:var(--accent);color:#fff;border-radius:12px;padding:12px 26px;font-weight:600;font-size:1.1rem}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:#fff;color:var(--accent);border:2px solid var(--accent)}
.btn.big{font-size:1.4rem;padding:14px 40px;margin-left:auto}
.err{color:#c0392b;font-weight:800;min-height:1.3em;margin-top:10px}
.intro{position:fixed;inset:0;display:none;overflow:auto;background:var(--bg);z-index:4;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));padding-top:calc(24px + env(safe-area-inset-top,0px))}.intro.on{display:flex}.intro .card{margin:auto}.it{border-left:8px solid var(--c);background:var(--accent-soft);border-radius:12px;padding:10px 16px;margin-bottom:10px}.it h3{margin:0;color:var(--c);font-size:1.35rem}.it p{margin:4px 0 0;white-space:pre-wrap}
.tn{margin:-6px 0 18px;background:var(--accent-soft);border-radius:14px;padding:4px 14px}.tn summary{cursor:pointer;font-weight:800;color:var(--accent);padding:10px 0;list-style-position:inside}.tnames{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px 16px;padding:4px 0 14px}.tnl{display:flex;flex-direction:column;gap:4px;min-width:0;font-weight:700;font-size:.85rem;color:var(--muted)}.tnl input{width:100%;min-width:0;max-width:100%}.tnl:empty{display:none}
.tl{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}.tl img{height:1.5em;width:auto;max-width:7em;object-fit:contain}.it h3{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.it h3 img{height:34px;width:auto;max-width:150px;object-fit:contain}.wl{margin:10px 0 4px}.wl img{height:clamp(56px,11vh,96px);max-width:85%;width:auto;object-fit:contain}.st img{height:16px;width:auto;vertical-align:middle;margin-left:8px}.st>span:nth-child(2){display:flex;align-items:center;flex-wrap:wrap}
.gmain h2 .nd,.gmain h2 .tg{display:block}.nd{font-size:clamp(1.1rem,2.6vw,1.7rem);font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.9}.tg{font-size:clamp(1.7rem,4.6vw,3.2rem);line-height:1.15;margin-top:4px;color:#fff;animation:glow 1.8s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 6px #fff,0 0 14px #c9a6ff,0 0 24px #a66bff;transform:scale(1)}to{text-shadow:0 0 12px #fff,0 0 28px #fdcb6e,0 0 48px #e84393,0 0 70px #a66bff;transform:scale(1.03)}}
@media(prefers-reduced-motion:reduce){.tg{animation:none;text-shadow:0 0 14px #c9a6ff}}
/* game */
.game{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);overflow:auto;z-index:5}
.game.on{display:flex}
.ghead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:#fff;padding:8px 18px;padding-top:calc(8px + env(safe-area-inset-top,0px));box-shadow:0 4px 18px #0004;flex:none}
.ghead .lg{height:clamp(64px,13vh,104px)}
.ghead .btn{padding:8px 18px;font-size:1rem;justify-self:start}
.badge{justify-self:end;background:var(--accent);color:#fff;border-radius:999px;padding:8px 18px;font-family:'Inter', sans-serif;font-weight:600}
.gmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));color:#fff;min-height:0}
.gmain h2{margin:0;font-size:clamp(1.6rem,4vw,2.6rem);text-align:center}
.stage{position:relative;width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center;gap:10px}
.fz{width:min(100%,520px);height:clamp(140px,26vh,230px);display:flex;align-items:center;justify-content:center}
.flash{width:100%;height:clamp(60px,9vh,80px);background:#fff;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 14px;font-family:'Inter',system-ui,sans-serif;font-weight:700;font-size:clamp(1.6rem,5vw,2.8rem);color:var(--accent);overflow:hidden;transition:color .1s;box-shadow:0 8px 24px #0004}
.flash.hide{opacity:0}
.bowl{position:relative;width:clamp(230px,min(46vw,42vh),420px);aspect-ratio:1/.62}
.bbody{position:absolute;inset:9% 0 0;border:5px solid #fff;border-top:0;border-radius:0 0 50% 50%/0 0 100% 100%;background:linear-gradient(#ffffff55,#ffffff22);overflow:hidden;box-shadow:inset 0 -14px 30px #0003}
.rim{position:absolute;left:-2%;top:0;width:104%;height:19%;border:5px solid #fff;border-radius:50%;background:#ffffff33;z-index:2}
.chits{position:absolute;inset:0}
.chit{position:absolute;width:23%;height:15%;border-radius:4px;border:2px solid #fff9;box-shadow:0 2px 5px #0005}
.mix .chit{animation:mix var(--dur) ease-in-out infinite alternate}
.mix .bbody{animation:wob 1s ease-in-out infinite alternate}
@keyframes mix{0%{transform:rotate(var(--r0))}25%{transform:translate(var(--x1),var(--y1)) rotate(var(--r1))}50%{transform:translate(var(--x2),var(--y2)) rotate(var(--r2))}75%{transform:translate(var(--x3),var(--y3)) rotate(var(--r0))}100%{transform:translate(var(--x1),var(--y2)) rotate(var(--r2))}}
@keyframes wob{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.fly img{height:26px;width:auto;max-width:94px;object-fit:contain}
.fly{flex-direction:column;gap:2px;position:absolute;width:112px;height:66px;background:#fff;border:4px solid var(--c);border-radius:8px;color:var(--c);display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Inter', sans-serif;font-weight:700;font-size:15px;line-height:1.05;padding:3px;z-index:6;box-shadow:0 10px 26px #0006;opacity:0;pointer-events:none;overflow:hidden;word-break:break-word}
.slot{width:100%;max-width:680px;display:flex;justify-content:center;min-height:64px}
.go{background:#fdcb6e;color:#2d0a3a;font-weight:700;font-size:clamp(1.3rem,3vw,1.8rem);border-radius:999px;padding:14px 46px;animation:pulse 1.3s ease-in-out infinite;box-shadow:0 0 0 0 #fdcb6e}
.go:disabled{animation:none;opacity:.6;cursor:wait}
@keyframes pulse{0%{box-shadow:0 0 0 0 #fdcb6eaa;transform:scale(1)}60%{box-shadow:0 0 0 20px #fdcb6e00;transform:scale(1.06)}100%{box-shadow:0 0 0 0 #fdcb6e00;transform:scale(1)}}
.res{background:#fff;color:var(--ink);border-radius:18px;padding:16px 22px;width:100%;text-align:center;box-shadow:0 10px 30px #0005;border-top:8px solid var(--c);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.res h3{margin:0 0 4px;font-size:clamp(1.4rem,3.4vw,2rem);color:var(--c)}
.res p{margin:0 0 12px;white-space:pre-wrap}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.strip{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:900px;max-height:22vh;overflow:auto}
.chip{background:#ffffff26;border:2px solid #ffffff55;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem}
.chip.cur{background:#fdcb6e;color:#2d0a3a;border-color:#fdcb6e}
.chip.done{background:#fff;color:var(--ink);border-color:#fff}
.chip.done b{color:var(--c)}
.fin{position:absolute;inset:0;background:#1d0626b8;display:none;align-items:center;justify-content:center;z-index:20}
.fin.on{display:flex}
.fin .btn{font-size:clamp(1.6rem,4.5vw,2.4rem);padding:22px 56px;border:5px solid #fff;border-radius:20px;box-shadow:0 12px 40px #0008}
/* results */
.modal{position:fixed;inset:0;background:#1d0626b8;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.pop{background:#fff;border-radius:22px;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:26px 28px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.pop h2{margin:0 0 14px;text-align:center;color:var(--accent);font-size:clamp(1.5rem,4vw,2.1rem)}
.win{background:linear-gradient(135deg,#f3e8f7,#e4cdee);border:3px solid var(--accent);border-radius:18px;padding:18px;text-align:center}
.win h3{margin:0;font-size:clamp(1.6rem,4.5vw,2.4rem);color:var(--accent)}
.win.draw{background:linear-gradient(135deg,#fff4d6,#ffe3a3);border-color:#c98a00}.win.draw h3{color:#7a4f00}.win .try{margin:10px 0 0;font-weight:800;font-size:1.15rem;color:var(--accent)}.win p{margin:8px 0;white-space:pre-wrap}
.win .cnt{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:4px 16px;font-weight:800}
.stats{margin:18px 0 6px}
.stats h4{margin:0 0 8px;font-family:'Inter', sans-serif;font-size:1.1rem;color:var(--muted)}
.st{display:grid;grid-template-columns:14px minmax(70px,1.9fr) 1.3fr auto;align-items:center;gap:10px;padding:8px 10px;border:2px solid transparent;border-radius:12px}
.st.w{border-color:var(--accent);background:var(--accent-soft)}
.dot{width:14px;height:14px;border-radius:50%}
.tr{height:12px;background:#eee;border-radius:99px;overflow:hidden}
.tr i{display:block;height:100%;border-radius:99px;min-width:0}
.st b{font-family:'Inter', sans-serif}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
@media(max-width:1024px){.card{max-width:700px}.gmain{gap:8px}}
@media(max-width:768px){.card{padding:22px 20px}.card h1{font-size:1.8rem}.ghead{padding:8px 12px}.badge{padding:6px 12px;font-size:.9rem}.btn.big{margin:0;width:100%}.pop{padding:22px 18px}}
@media(max-width:520px){.setup{padding:12px 8px}.card{padding:18px 14px}.trow{grid-template-columns:1fr auto}.trow .no{grid-column:1;justify-self:start}.trow .x{grid-column:2}.trow textarea,.trow input{grid-column:1/3}.ghead{grid-template-columns:auto 1fr auto}.ghead .btn{padding:6px 12px;font-size:.9rem}.ghead .lg{height:52px;justify-self:center}.go{padding:12px 32px}.st{grid-template-columns:12px 1fr auto;}.st .tr{grid-column:2/4;grid-row:2}.row .btn{flex:1}}
@media(prefers-reduced-motion:reduce){.go{animation:none}}

/* v-assign */
.dlb{width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px #4818558c}.dlb:hover{filter:brightness(1.2)}.sc{display:inline-flex;align-items:center;gap:8px}.sc img{height:22px;width:auto;max-width:70px;object-fit:contain}
.intro .card{max-width:1100px}.intro .card h1{font-size:clamp(2rem,4vw,3rem)}.intro .sub{font-size:1.15rem}
#ilist{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:8px}
.it{border-left:0;border-top:10px solid var(--c);text-align:center;padding:28px 18px;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.it h3{display:block;font-size:clamp(1.8rem,3.8vw,3.2rem);margin:0}
.big-logo img{height:clamp(70px,15vh,140px);width:auto;max-width:90%;object-fit:contain}
.pop{max-width:780px}.pop>.row{position:sticky;bottom:-26px;background:#fff;padding:12px 0;margin-top:0}
.sum{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.sc{background:var(--accent-soft);border:2px solid var(--c);color:var(--ink);border-radius:999px;padding:6px 16px;font-weight:700}
.alist{border:2px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:6px}
.ar{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-left:8px solid var(--c)}
.ar:nth-child(even){background:#faf5fc}
.ano{font-weight:800;color:var(--muted)}.an{font-weight:700}
.ts{display:inline-flex;align-items:center;gap:10px;font-weight:700;color:var(--c);justify-content:flex-end;text-align:right}
.ts img{height:26px;width:auto;max-width:90px;object-fit:contain}
@media(max-width:600px){#ilist{grid-template-columns:1fr}.ar{grid-template-columns:26px 1fr}.ts{grid-column:2;justify-content:flex-start;text-align:left}}
</style>
</head>
<body>
<section class="intro" id="intro">
 <div class="card">
  <img class="lg" alt="FutureMindz Fest, hosted by Dubai CommerCity">
  <h1>Case Studies for the Draw</h1>
  <p class="sub" id="isub"></p>
  <div id="ilist"></div>
  <div class="row"><button class="btn big" id="begin" type="button">Begin Draw</button></div>
 </div>
</section>

<section class="game" id="game">
 <header class="ghead"><span></span><img class="lg" alt="FutureMindz Fest"><div class="badge" id="badge"></div></header>
 <main class="gmain">
  <h2 id="now"></h2>
  <div class="stage" id="stage">
   <div class="fz" id="fz"><div class="flash" id="flash">?</div></div>
   <div class="bowl" id="bowl"><div class="bbody"><div class="chits" id="chits"></div></div><div class="rim"></div></div>
  </div>
  <div class="slot" id="slot"></div>
 </main>
 <div class="fin" id="fin"><button class="btn big" id="show" type="button" style="margin:0">🎉 Show Results</button></div>
</section>

<div class="modal" id="modal"><div class="pop" role="dialog" aria-modal="true" aria-labelledby="mt">
 <h2 id="mt">FutureMindz Fest Case Study Assignments</h2>
 <div class="sum" id="sum"></div>
 <div class="alist" id="alist"></div>
 <div class="row" style="justify-content:center"><button class="dlb" id="dl" type="button" title="Download CSV" aria-label="Download CSV"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/></svg></button></div>
</div></div>
<canvas id="cf"></canvas>

const TOPICS=[
 {title:'Case Study:',key:'Case Study: eBay',logo:LG_EBAY,color:PAL[0],detail:''},
 {title:'Case Study:',key:'Case Study: Tradeling',logo:LG_TRAD,color:PAL[1],detail:''}
];
const logo=(t,alt='')=>t.logo?`<img src="${t.logo}" alt="${esc(alt)}">`:'';
function init(){
 clearInterval(flashT);stopSound();
 const off=Math.floor(Math.random()*TOPICS.length),bag=Array.from({length:TEAMS.length},(_,i)=>(i+off)%TOPICS.length);
 for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}
 G={N:TEAMS.length,topics:TOPICS,cur:0,picks:[],busy:false,names:TEAMS,bag};
 $('#game').classList.remove('on');$('#fin').classList.remove('on');
 $('#isub').textContent=`${TOPICS.length} case studies · ${TEAMS.length} teams · each team is assigned one`;
 $('#ilist').innerHTML=TOPICS.map(t=>`<div class="it" style="--c:${t.color}"><h3>${esc(t.title)}</h3><div class="big-logo">${logo(t)}</div></div>`).join('');
 $('#intro').classList.add('on');$('#intro').scrollTop=0;
}
$('#begin').onclick=()=>{$('#intro').classList.remove('on');$('#game').classList.add('on');renderTeam()};

/* ---------- game ---------- */
function buildBowl(){
 const c=$('#chits');c.innerHTML='';$('#bowl').classList.remove('mix');
 for(let i=0;i<18;i++){
  const e=document.createElement('div');e.className='chit';
  e.style.background=G.topics[i%G.topics.length].color;
  e.style.left=rnd(6,70)+'%';e.style.top=rnd(34,78)+'%';
  const s=e.style,p=(a)=>rnd(-a,a);
  s.setProperty('--r0',p(60)+'deg');s.transform='rotate('+s.getPropertyValue('--r0')+')';
  s.setProperty('--r1',p(180)+'deg');s.setProperty('--r2',p(180)+'deg');
  ['x1','x2','x3'].forEach(k=>s.setProperty('--'+k,p(140)+'%'));
  ['y1','y2','y3'].forEach(k=>s.setProperty('--'+k,p(160)+'%'));
  s.setProperty('--dur',rnd(1.3,2.4)+'s');s.animationDelay=-rnd(0,1.5)+'s';
  c.append(e);
 }
}
function renderTeam(){
 clearInterval(flashT);G.busy=false;
 $('#now').innerHTML='<span class="nd">Now Drawing</span><span class="tg">'+esc(G.names[G.cur])+'</span>';
 $('#badge').textContent=`Team ${G.cur+1} / ${G.N}`;
 const f=$('#flash');f.textContent='?';f.style.color='var(--accent)';f.classList.remove('hide');
 document.querySelectorAll('.fly').forEach(e=>e.remove());
 $('#fin').classList.remove('on');
 $('#slot').innerHTML='<button class="go" id="go" type="button">Round Start</button>';
 $('#go').onclick=draw;buildBowl();
}
function draw(){
 if(G.busy)return;G.busy=true;
 $('#go').disabled=true;$('#bowl').classList.add('mix');
 const f=$('#flash');f.textContent='Mixing…';f.style.color='var(--accent)';
 startSound(5000);
 flashT=setTimeout(()=>{$('#bowl').classList.remove('mix');fly(G.bag[G.cur])},5000);

 const a=el.animate([
  {opacity:0,transform:'translate(0,0) scale(.4) rotate(0)',offset:0},
  {opacity:1,transform:`translate(${dx*.1}px,${-br.height*.45}px) scale(1) rotate(-14deg)`,offset:.3},
  {opacity:1,transform:`translate(${dx*.6}px,${dy-30}px) scale(${sc*1.15}) rotate(10deg)`,offset:.7},
  {opacity:1,transform:`translate(${dx}px,${dy}px) scale(${sc}) rotate(0)`,offset:1}
 ],{duration:1500,easing:'cubic-bezier(.25,.8,.3,1)',fill:'forwards'});
 a.onfinish=()=>{
  G.picks[G.cur]=k;
  const last=G.cur===G.N-1;
  $('#slot').innerHTML=last?'':'<button class="btn" id="next" type="button" style="font-size:1.5rem;padding:14px 44px;background:#fff;color:var(--accent);border:4px solid #fdcb6e">Next Team →</button>';
  if(last)setTimeout(()=>$('#fin').classList.add('on'),1200);
  else $('#next').onclick=()=>{G.cur++;renderTeam()};
 };
}
$('#show').onclick=()=>{$('#fin').classList.remove('on');results()};

/* ---------- results ---------- */
function results(){
 const cnt=G.topics.map(()=>0);G.picks.forEach(p=>cnt[p]++);
 $('#sum').innerHTML=G.topics.map((t,i)=>`<span class="sc" style="--c:${t.color}">${logo(t,t.key)}<b>${cnt[i]}</b> team${cnt[i]===1?'':'s'}</span>`).join('');
 $('#alist').innerHTML=G.names.map((n,i)=>{const t=G.topics[G.picks[i]];return t?`<div class="ar" style="--c:${t.color}"><span class="ano">${i+1}</span><span class="an">${esc(n)}</span><span class="ts">${logo(t,t.key)}</span></div>`:''}).join('');
 $('#modal').classList.add('on');confetti();
}
function csv(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';return '\ufeff'+['Team,Key_topic_name'].concat(G.names.map((n,i)=>q(n)+','+q(G.topics[G.picks[i]].key))).join('\r\n')}
$('#dl').onclick=async()=>{
 const data=csv(),fn='futuremindz-fest-team-assignments.csv';
 try{const d=window.claude&&claude.use?await claude.use('downloads'):null;if(d){await d.save({filename:fn,data});return}}catch(e){if(e&&e.code==='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));a.download=fn;document.body.append(a);a.click();a.remove();
};

function confetti(){
 cancelAnimationFrame(cfRaf);
 const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const W=c.width,H=c.height,ps=[],u=Math.max(10,H/38);
 const mk=(ox,oy,a0,a1,n)=>{for(let i=0;i<n;i++){const a=rnd(a0,a1),s=rnd(.4,1.1)*u;ps.push({x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,w:rnd(7,13),h:rnd(4,8),r:rnd(0,6),vr:rnd(-.35,.35),c:CONF[i%CONF.length],l:1,d:rnd(.004,.01)})}};
 mk(W/2,H/2,0,Math.PI*2,100);mk(0,H,-1.45,-.5,75);mk(W,H,-2.64,-1.7,75);
 const step=()=>{
  x.clearRect(0,0,W,H);
  for(const p of ps){p.vy+=.28;p.vx*=.99;p.vy*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=p.d;
   if(p.l<=0)continue;x.save();x.globalAlpha=Math.min(1,p.l*1.5);x.translate(p.x,p.y);x.rotate(p.r);x.scale(1,Math.abs(Math.cos(p.r*1.7))*.8+.2);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}
  if(ps.some(p=>p.l>0&&p.y<H+30))cfRaf=requestAnimationFrame(step);else x.clearRect(0,0,W,H);
 };
 step();
}
init();
</script>
